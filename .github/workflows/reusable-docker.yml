name: Reusable Docker Build & Push

on:
    workflow_call:
        inputs:
            image_name:
                required: true
                type: string

            tags:
                required: true
                type: string

            docker_context:
                required: true
                type: string


        secrets:
            docker_username: 
                required: true
            docker_token: 
                required: true

        outputs:
            image_url:
                description: Primary Docker image URL (latest tag)
                value: ${{ jobs.docker-build-and-push.outputs.job_image_url }}

jobs:
    docker-build-and-push:
        runs-on: ubuntu-latest

        outputs:
            job_image_url: ${{ steps.set-image-url.outputs.image_url }}

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Docker Login
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.docker_username }}
                password: ${{ secrets.docker_token }}

            - name: Build and Push Docker Image
              uses: docker/build-push-action@v6
              with:
                context: ${{ inputs.docker_context }}
                push: true
                tags: ${{ inputs.tags }}
            
            - name: Set Image URL
              id: set-image-url
              run: |
                echo "image_url=${{ inputs.image_name }}:latest" >> $GITHUB_OUTPUT
                

