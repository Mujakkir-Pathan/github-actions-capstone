name: Main Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      go_version: "1.22"
      run_tests: true

  prepare:
    runs-on: ubuntu-latest
    needs: build-and-test

    outputs:
      short_sha: ${{ steps.short-sha.outputs.short_sha }}

    steps:
      - name: Generate Short SHA
        id: short-sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

  docker-frontend:
    needs:
      - build-and-test
      - prepare
    uses: ./.github/workflows/reusable-docker.yml
    with:
      image_name: mujakkirpathan/devboard-frontend
      tags: |
        mujakkirpathan/devboard-frontend:latest
        mujakkirpathan/devboard-frontend:sha-${{ needs.prepare.outputs.short_sha }}
      docker_context: frontend
    secrets:
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      docker_token: ${{ secrets.DOCKER_TOKEN }}

  docker-backend:
    needs:
      - build-and-test
      - prepare
    uses: ./.github/workflows/reusable-docker.yml
    with:
      image_name: mujakkirpathan/devboard-backend
      tags: |
        mujakkirpathan/devboard-backend:latest
        mujakkirpathan/devboard-backend:sha-${{ needs.prepare.outputs.short_sha }}
      docker_context: backend
    secrets:
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      docker_token: ${{ secrets.DOCKER_TOKEN }}


  security-scan:
    needs: 
      -  docker-backend
      -  docker-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: image
          image-ref: mujakkirpathan/devboard-backend:latest
          severity: CRITICAL
          exit-code: 1
          format: table
          output: trivy-backend-report.txt

      - name: Upload Backend Scan Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-backend-report
          path: trivy-backend-report.txt

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: image
          image-ref: mujakkirpathan/devboard-frontend:latest
          severity: CRITICAL
          exit-code: 1
          format: table
          output: trivy-frontend-report.txt

      - name: Upload Frontend Scan Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-frontend-report
          path: trivy-frontend-report.txt

  deploy:
    runs-on: ubuntu-latest
    needs:
      - docker-frontend
      - docker-backend
      - security-scan
    environment: production

    steps:
      - name: Show Deployment Information
        run: |
          echo "Deploying frontend image: ${{ needs.docker-frontend.outputs.image_url }} to production"
          echo "Deploying backend image: ${{ needs.docker-backend.outputs.image_url }} to production"