name: Health Check

on:
  workflow_dispatch:

  schedule:
    - cron: '0 */12 * * *'

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Pull Latest Docker Image
        run: |
          docker pull mujakkirpathan/devboard-backend:latest

      - name: Create Docker Network
        run: |
          docker network create devboard-network

      - name: Start PostgreSQL Container
        run: |
          docker run -d \
            --name postgres \
            --network devboard-network \
            -e POSTGRES_USER=${{ secrets.POSTGRES_USER }} \
            -e POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} \
            -e POSTGRES_DB=${{ secrets.POSTGRES_DB }} \
            -v ${{ github.workspace }}/init/postgres:/docker-entrypoint-initdb.d:ro \
            postgres:16-alpine

      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL to become ready..."

          for i in {1..30}; do
            if docker exec postgres pg_isready \
              -U ${{ secrets.POSTGRES_USER }} \
              -d ${{ secrets.POSTGRES_DB }}; then
              echo "PostgreSQL is ready!"
              exit 0
            fi

            echo "PostgreSQL not ready yet... retrying in 2 seconds"
            sleep 2
          done

          echo "PostgreSQL failed to start."
          exit 1

      - name: Run Backend Container
        run: |
            docker run -d --name backend --network devboard-network \
              -p 8080:8080 \
              -e PORT=8080 \
              -e POSTGRES_URL=postgres://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/${{ secrets.POSTGRES_DB }}?sslmode=disable \
              mujakkirpathan/devboard-backend:latest

      - name: Wait for Backend
        run: sleep 5

      - name: Check Health Endpoint
        run: |
            if curl -f http://localhost:8080/health; then
                echo "HEALTH_STATUS=PASSED" >> $GITHUB_ENV
            else
                echo "HEALTH_STATUS=FAILED" >> $GITHUB_ENV
                exit 1
            fi

      - name: Generate Health Check Summary
        if: always()
        run: |
            echo "## Health Check Report" >> $GITHUB_STEP_SUMMARY
            echo "- Image: mujakkirpathan/devboard-backend:latest" >> $GITHUB_STEP_SUMMARY
            echo "- Status: ${{ env.HEALTH_STATUS }}" >> $GITHUB_STEP_SUMMARY
            echo "- Time: $(date)" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup Docker Resources
        if: always()
        run: |
            docker rm -f backend || true
            docker rm -f postgres || true
            docker network rm devboard-network || true

